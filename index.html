<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои путешествия</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <h1>Мои путешествия</h1>
  <p>Кликните на фото на глобусе, точку в календаре или альбом справа</p>
</header>

<div id="globeViz"></div>

<aside class="sidebar">
  <section class="sidebar-section" id="calendarSection">
    <h2>Календарь поездок</h2>
    <div id="calendar" class="calendar"></div>
  </section>
  <section class="sidebar-section" id="albumsSection">
    <h2>Альбомы</h2>
    <div id="albums" class="albums"></div>
  </section>
</aside>

<div id="modal" class="modal hidden">
  <div class="modal-content">
    <button id="modalClose" class="modal-close">&times;</button>
    <h2 id="modalTitle"></h2>
    <p id="modalMeta" class="modal-meta"></p>
    <p id="modalNotes"></p>
    <div id="modalGallery" class="gallery"></div>
  </div>
</div>

<div id="lightbox" class="lightbox hidden">
  <button id="lightboxClose" class="lightbox-close">&times;</button>
  <img id="lightboxImg" src="" alt="">
  <p id="lightboxCaption" class="lightbox-caption"></p>
</div>

<script src="https://unpkg.com/globe.gl"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
