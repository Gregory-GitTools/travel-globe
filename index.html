<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои путешествия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#05070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

<div id="globeViz"></div>

<div id="cloudOverlay" class="cloud-overlay hidden"></div>

<div id="flatMap" class="flat-map layer-off">
  <div id="flatMapCanvas"></div>
</div>

<div id="mapSearchBar" class="map-search-bar hidden">
  <input id="mapSearchInput" type="text" placeholder="Поиск места на карте" autocomplete="off">
  <button id="mapSearchBtn" class="toolbar-button" title="Найти">🔍</button>
</div>

<div id="mapTools" class="map-tools hidden">
  <button id="rulerToggle" class="toolbar-button" title="Измерить расстояние">📏 Линейка</button>
  <button id="rulerClear" class="toolbar-button hidden" title="Очистить линейку">✕ Очистить</button>
</div>

<div class="toolbar toolbar-left">
  <button id="navRefresh" class="toolbar-button" title="Обновить страницу">⟳ Обновить</button>
  <button id="navBack" class="toolbar-button" title="Назад">◀ Назад</button>
</div>

<div id="backJoke" class="back-joke hidden"></div>

<div class="toolbar">
  <button id="openAlbumsBtn" class="toolbar-button">📁 Альбомы</button>
  <button id="toolbarMapToggle" class="toolbar-button" title="Переключить карта/глобус">🗺️ Карта</button>
  <button id="toolbarSettings" class="toolbar-button" title="Настройки">⚙️</button>
</div>

<div id="settingsModal" class="modal hidden">
  <div class="modal-content">
    <button id="settingsModalClose" class="modal-close">&times;</button>
    <h2>Настройки</h2>
    <label class="settings-row">
      <span>Автовращение глобуса</span>
      <input type="checkbox" id="settingAutoRotate">
    </label>

    <button id="installAppBtn" class="map-button install-app-btn hidden">📲 Установить на экран</button>

    <div id="devSettings" class="dev-settings hidden">
      <hr>
      <h3>Настройки разработчика</h3>
    </div>

    <div id="aboutRow" class="about-row">
      <img id="aboutLogo" class="about-logo" src="icons/icon-192.png" width="22" height="22" alt="">
      <span class="about-text">Travel Globe</span>
    </div>
  </div>
</div>

<div id="albumsModal" class="modal modal-anchor-top hidden">
  <div class="modal-content modal-content-split">
    <button id="albumsModalClose" class="modal-close">&times;</button>
    <div class="modal-header">
      <h2>Альбомы</h2>
      <div class="albums-search">
        <input type="text" id="albumsSearchText" placeholder="Поиск по названию или городу">
        <button id="albumsSearchClear" class="icon-button" title="Сбросить фильтр">&times;</button>
      </div>
      <div id="albumsCalendar" class="albums-calendar">
        <div id="calendarNav" class="calendar-nav">
          <button id="calendarPrev" class="icon-button">&#10094;</button>
          <div class="calendar-dd" id="calendarDayDD">
            <button type="button" id="calendarDayBtn" class="calendar-select"></button>
            <div id="calendarDayList" class="calendar-dd-list hidden"></div>
          </div>
          <div class="calendar-dd" id="calendarMonthDD">
            <button type="button" id="calendarMonthBtn" class="calendar-select"></button>
            <div id="calendarMonthList" class="calendar-dd-list hidden"></div>
          </div>
          <div class="calendar-dd" id="calendarYearDD">
            <button type="button" id="calendarYearBtn" class="calendar-select"></button>
            <div id="calendarYearList" class="calendar-dd-list hidden"></div>
          </div>
          <button id="calendarNext" class="icon-button">&#10095;</button>
          <button id="goTodayBtn" class="map-button" title="Перейти к сегодняшней дате"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="9" x2="21" y2="9"/><path d="M8 14l2.5 2.5L16 11"/></svg></button>
          <button id="albumsCalendarToggle" class="icon-button" title="Свернуть/развернуть календарь">🔼</button>
        </div>
        <div id="calendarBody">
          <div id="calendarWeekdays" class="calendar-grid calendar-weekdays"></div>
          <div id="calendarGrid" class="calendar-grid"></div>
        </div>
      </div>
    </div>
    <div class="modal-body">
      <div id="albums" class="albums"></div>
    </div>
  </div>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-content modal-content-split">
    <button id="modalClose" class="modal-close">&times;</button>
    <div class="modal-header">
      <h2 id="modalTitle"></h2>
      <p id="modalNotes"></p>
      <div class="modal-actions">
        <button id="modalSlideshow" class="map-button">&#127909; Слайдшоу</button>
        <button id="modalMap" class="map-button">🗺️ Карта</button>
        <button id="modalGeminiText" class="gemini-button">💬 Gemini</button>
        <button id="modalGeminiPhoto" class="gemini-button">📷 Gemini</button>
        <button id="modalSpeak" class="icon-button" title="Прослушать описание">🔊</button>
        <span id="modalMeta" class="modal-meta"></span>
      </div>
    </div>
    <div class="modal-body">
      <div id="modalGallery" class="gallery"></div>
    </div>
  </div>
</div>

<div id="lightbox" class="lightbox hidden">
  <button id="lightboxClose" class="lightbox-close">&times;</button>
  <button id="lightboxPrev" class="lightbox-nav lightbox-prev">&#10094;</button>
  <img id="lightboxImg" src="" alt="">
  <button id="lightboxNext" class="lightbox-nav lightbox-next">&#10095;</button>
  <div class="lightbox-overlay">
    <p id="lightboxCaption" class="lightbox-caption"></p>
    <div class="lightbox-actions">
      <button id="lightboxSlideshow" class="map-button">&#127909; Слайдшоу</button>
      <button id="lightboxMap" class="map-button">🗺️ Карта</button>
      <button id="lightboxGeminiText" class="gemini-button">💬 Gemini</button>
      <button id="lightboxGeminiPhoto" class="gemini-button">📷 Gemini</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/globe.gl"></script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
