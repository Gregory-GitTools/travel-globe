<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои путешествия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="globeViz"></div>

<div class="toolbar">
  <button id="openAlbumsBtn" class="toolbar-button">📁 Альбомы</button>
  <button id="openCalendarBtn" class="toolbar-button">📅 Календарь</button>
  <button id="toolbarMute" class="toolbar-button" title="Звук сайта: вкл/выкл">🔊</button>
</div>

<div id="calendarModal" class="modal modal-anchor-top hidden">
  <div class="modal-content calendar-modal-content">
    <button id="calendarModalClose" class="modal-close">&times;</button>
    <div class="calendar-header">
      <h2>Календарь поездок</h2>
      <div class="calendar-view-toggle">
        <button id="calendarViewMonth" class="map-button active">Месяц</button>
        <button id="calendarViewYear" class="map-button">Год целиком</button>
        <button id="goTodayBtn" class="map-button" title="Перейти к сегодняшнему месяцу">📍 Сегодня</button>
      </div>
      <div id="calendarNav" class="calendar-nav">
        <button id="calendarPrev" class="icon-button">&#10094;</button>
        <div class="calendar-dd" id="calendarMonthDD">
          <button type="button" id="calendarMonthBtn" class="calendar-select"></button>
          <div id="calendarMonthList" class="calendar-dd-list hidden"></div>
        </div>
        <div class="calendar-dd" id="calendarYearDD">
          <button type="button" id="calendarYearBtn" class="calendar-select"></button>
          <div id="calendarYearList" class="calendar-dd-list hidden"></div>
        </div>
        <button id="calendarNext" class="icon-button">&#10095;</button>
      </div>
    </div>
    <div class="calendar-body">
      <div id="calendarWeekdays" class="calendar-grid calendar-weekdays"></div>
      <div id="calendarGrid" class="calendar-grid"></div>
      <div id="calendarYearGrid" class="calendar-year-grid hidden"></div>
    </div>
  </div>
</div>

<div id="albumsModal" class="modal hidden">
  <div class="modal-content modal-content-split">
    <button id="albumsModalClose" class="modal-close">&times;</button>
    <div class="modal-header">
      <h2>Альбомы</h2>
      <div class="albums-search">
        <input type="text" id="albumsSearchText" placeholder="Поиск по названию или городу">
        <input type="date" id="albumsSearchDate" title="Показать поездки на эту дату">
        <button id="albumsSearchClear" class="icon-button" title="Сбросить фильтр">&times;</button>
      </div>
    </div>
    <div class="modal-body">
      <div id="albums" class="albums"></div>
    </div>
  </div>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-content modal-content-split">
    <button id="modalClose" class="modal-close">&times;</button>
    <div class="modal-header">
      <h2 id="modalTitle"></h2>
      <p id="modalNotes"></p>
      <div class="modal-actions">
        <button id="modalSlideshow" class="map-button">&#127909; Слайдшоу</button>
        <button id="modalMap" class="map-button">&#128205; Карта</button>
        <button id="modalGeminiText" class="gemini-button">💬 Gemini</button>
        <button id="modalGeminiPhoto" class="gemini-button">📷 Gemini</button>
        <button id="modalSpeak" class="icon-button" title="Прослушать описание">🔊</button>
        <span id="modalMeta" class="modal-meta"></span>
      </div>
    </div>
    <div class="modal-body">
      <div id="modalGallery" class="gallery"></div>
    </div>
  </div>
</div>

<div id="lightbox" class="lightbox hidden">
  <button id="lightboxClose" class="lightbox-close">&times;</button>
  <button id="lightboxPrev" class="lightbox-nav lightbox-prev">&#10094;</button>
  <img id="lightboxImg" src="" alt="">
  <button id="lightboxNext" class="lightbox-nav lightbox-next">&#10095;</button>
  <div class="lightbox-overlay">
    <p id="lightboxCaption" class="lightbox-caption"></p>
    <div class="lightbox-actions">
      <button id="lightboxSlideshow" class="map-button">&#127909; Слайдшоу</button>
      <button id="lightboxMap" class="map-button">&#128205; Карта</button>
      <button id="lightboxMusic" class="map-button">&#127925; Музыка</button>
      <button id="lightboxGeminiText" class="gemini-button">💬 Gemini</button>
      <button id="lightboxGeminiPhoto" class="gemini-button">📷 Gemini</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/globe.gl"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
